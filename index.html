<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a6b">
<title>Tümersan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="simgeler/simge-192.png">
<link rel="apple-touch-icon" href="simgeler/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tümersan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  /* ================= Renkler (imzadaki tonlar) ================= */
  :root {
    --lacivert: #1b2a6b;
    --lacivert-koyu: #131f52;
    --gri: #8b9099;
    --gri-acik: #e3e5ea;
    --zemin: #f3f4f7;
    --kart: #ffffff;
    --yazi: #1d1f24;
    --hata: #c62828;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--zemin);
    color: var(--yazi);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; }

  /* ================= Logo ================= */
  .logo { display: inline-flex; flex-direction: column; align-items: stretch; }
  .logo-kutu {
    background: var(--lacivert); color: #fff; border-radius: 14px;
    padding: 4px 22px 10px; font-weight: 800; font-size: 54px; line-height: 1;
    letter-spacing: -1px; text-align: center;
  }
  .logo-alt {
    display: flex; align-items: center; gap: 10px; margin-top: 8px;
    color: var(--gri); font-weight: 600; font-size: 15px; letter-spacing: 7px;
  }
  .logo-alt::before, .logo-alt::after { content: ""; flex: 1; height: 2px; background: var(--gri); }
  .logo-alt span { margin-right: -7px; } /* son harfteki boşluğu dengele */

  /* ================= Giriş ekranı ================= */
  .giris {
    min-height: 100%; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .giris-orta { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .kart {
    width: 100%; max-width: 920px; background: var(--kart); border-radius: 16px;
    box-shadow: 0 2px 18px rgba(20, 30, 70, .08);
    display: flex; align-items: stretch;
  }
  .marka {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 32px; text-align: center; gap: 22px;
  }
  .firma { font-weight: 700; font-size: 17px; color: var(--yazi); margin: 0; }
  .ayrac { width: 2px; background: var(--gri-acik); margin: 32px 0; }
  .panel { flex: 1; padding: 40px 40px; display: flex; flex-direction: column; justify-content: center; }

  .panel h1 { margin: 0; font-size: 26px; color: var(--lacivert); }
  .cizgi { display: flex; align-items: center; gap: 0; margin: 12px 0 22px; }
  .cizgi::before { content: ""; width: 56px; height: 4px; background: var(--lacivert); }
  .cizgi::after { content: ""; flex: 1; height: 1px; background: var(--gri-acik); }
  .aciklama { margin: 0 0 18px; color: var(--gri); font-size: 16px; }

  .bolumler { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .bolum {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    min-height: 130px; padding: 16px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--gri-acik); background: #fff; color: var(--lacivert);
    font-size: 20px; font-weight: 700; transition: border-color .15s, background .15s, transform .1s;
  }
  .bolum svg { width: 40px; height: 40px; }
  .bolum:hover { border-color: var(--lacivert); background: #f6f7fb; }
  .bolum:active { transform: scale(.98); }

  .geri {
    align-self: flex-start; border: none; background: none; color: var(--gri);
    padding: 0; margin: 0 0 14px; cursor: pointer; font-size: 15px;
  }
  .geri:hover { color: var(--lacivert); }
  form { display: flex; flex-direction: column; gap: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--gri); font-weight: 600; }
  input[type=text], input[type=password] {
    padding: 13px 14px; font-size: 18px; border-radius: 10px; color: var(--yazi);
    border: 1.5px solid var(--gri-acik); background: var(--zemin); outline: none;
  }
  input[type=text]:focus, input[type=password]:focus { border-color: var(--lacivert); background: #fff; }
  .goster { flex-direction: row; align-items: center; gap: 8px; font-weight: 400; cursor: pointer; }
  .goster input { width: 18px; height: 18px; accent-color: var(--lacivert); }
  .hata { color: var(--hata); font-size: 15px; margin: 0; }
  .ana-buton {
    padding: 14px; border: none; border-radius: 10px; cursor: pointer;
    background: var(--lacivert); color: #fff; font-size: 18px; font-weight: 700;
  }
  .ana-buton:hover { background: var(--lacivert-koyu); }
  .ana-buton:disabled { opacity: .7; cursor: default; }

  /* İmzadaki alt şerit */
  .serit { display: flex; gap: 14px; height: 12px; margin: 0 16px 16px; }
  .serit::before { content: ""; flex: 1; background: var(--lacivert); clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
  .serit::after { content: ""; width: 12%; background: var(--lacivert); clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%); }

  /* ================= Uygulama kabuğu ================= */
  .uygulama { height: 100%; height: 100dvh; display: flex; flex-direction: column; }
  .ust {
    background: var(--lacivert); color: #fff; flex: none;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    padding: 10px 20px; padding-top: max(10px, env(safe-area-inset-top));
  }
  .ust-sol, .ust-sag { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .ust-sag { justify-content: flex-end; }
  .ust .marka-kucuk { font-weight: 800; font-size: 26px; letter-spacing: -.5px; }
  .ust .bolum-etiket {
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase; opacity: .8;
    border-left: 1px solid rgba(255,255,255,.35); padding-left: 14px; white-space: nowrap;
  }
  /* Yönetim girişinde ortada parlak, belirgin YÖNETİM yazısı */
  .yonetim-baslik {
    font-size: 24px; font-weight: 800; letter-spacing: 7px; color: #ffd34d;
    padding: 3px 10px 3px 17px; border: 2px solid #ffd34d; border-radius: 8px;
    background: rgba(255, 211, 77, .12); text-shadow: 0 0 12px rgba(255, 211, 77, .55);
    white-space: nowrap; line-height: 1.2;
  }
  .ust .kim { font-size: 15px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cikis {
    border: 1.5px solid rgba(255,255,255,.6); background: none; color: #fff; white-space: nowrap;
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600;
  }
  .cikis:hover { background: rgba(255,255,255,.12); }

  /* Ana menü: modül düğmeleri soldan başlar, yenileri yanına / altına eklenir */
  .ana-sayfa { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .moduller { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 210px)); gap: 14px; }
  .modul { min-height: 130px; }

  /* Genel düğmeler */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 16px; border-radius: 9px; cursor: pointer; font-size: 15px; font-weight: 600;
    border: 1.5px solid var(--lacivert); background: #fff; color: var(--lacivert); white-space: nowrap;
  }
  .btn:hover { background: #f1f3f9; }
  .btn.ana { background: var(--lacivert); color: #fff; }
  .btn.ana:hover { background: var(--lacivert-koyu); }
  .btn.tehlike { border-color: var(--hata); color: var(--hata); }
  .btn.tehlike.ana { background: var(--hata); color: #fff; }
  .btn.sade { border-color: var(--gri-acik); color: var(--yazi); }
  .btn.kucuk { padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: .55; cursor: default; }
  select, textarea, input[type=number], input[type=datetime-local] {
    padding: 11px 12px; font-size: 16px; border-radius: 10px; color: var(--yazi); font-family: inherit;
    border: 1.5px solid var(--gri-acik); background: var(--zemin); outline: none; width: 100%;
  }
  select:focus, textarea:focus, input[type=number]:focus, input[type=datetime-local]:focus { border-color: var(--lacivert); background: #fff; }
  textarea { resize: vertical; min-height: 70px; }

  /* ================= Dikey / dar ekran (telefon dik) ================= */
  @media (max-width: 720px) and (orientation: portrait) {
    .kart { flex-direction: column; max-width: 480px; }
    .ayrac { width: auto; height: 2px; margin: 0 28px; }
    .marka { padding: 32px 24px 24px; gap: 16px; }
    .panel { padding: 24px 24px 32px; }
    .logo-kutu { font-size: 44px; }
  }
  /* Dar üst çubuk: isim gizlenir, YÖNETİM küçülür ama her zaman görünür */
  @media (max-width: 760px) {
    .ust { padding-left: 12px; padding-right: 12px; gap: 8px; }
    .ust .kim { display: none; }
    .ust .marka-kucuk { font-size: 21px; }
    .yonetim-baslik { font-size: 16px; letter-spacing: 3px; padding: 2px 6px 2px 9px; }
    .cikis { padding: 6px 10px; font-size: 14px; }
  }
  @media (max-width: 420px) {
    .ust .marka-kucuk { font-size: 18px; }
    .ust .bolum-etiket { display: none; }
  }

  /* ================= Yatay telefon (alçak ekran) ================= */
  @media (max-height: 520px) and (orientation: landscape) {
    .giris-orta { padding: 12px 16px; }
    .marka { padding: 16px 20px; gap: 12px; }
    .logo-kutu { font-size: 38px; padding: 2px 16px 8px; border-radius: 10px; }
    .logo-alt { font-size: 12px; letter-spacing: 5px; margin-top: 6px; }
    .firma { font-size: 14px; }
    .ayrac { margin: 16px 0; }
    .panel { padding: 16px 24px; }
    .panel h1 { font-size: 21px; }
    .cizgi { margin: 8px 0 12px; }
    .aciklama { margin-bottom: 10px; font-size: 14px; }
    .bolum { min-height: 96px; font-size: 18px; gap: 6px; }
    .bolum svg { width: 30px; height: 30px; }
    .geri { margin-bottom: 8px; }
    form { gap: 9px; }
    input[type=text], input[type=password] { padding: 9px 12px; font-size: 16px; }
    .ana-buton { padding: 11px; font-size: 16px; }
    .serit { height: 8px; margin-bottom: 8px; }
    .icerik h2 { font-size: 36px; }
  }
  @media (max-height: 420px) and (orientation: landscape) {
    .firma { display: none; }
    .panel h1 { font-size: 19px; }
    .cizgi { margin: 6px 0 10px; }
    label { gap: 3px; }
    form { gap: 7px; }
  }

  /* ================= Kalıp takibi ================= */
  .kalip-sayfa { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 12px; }
  .arac-cubugu { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: none; }
  .arac-cubugu h2 { margin: 0 8px 0 4px; font-size: 21px; color: var(--lacivert); }
  .arac-cubugu .bosluk { flex: 1; }
  .kalip-alan { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 64px 1fr; position: relative; }
  .liste-kutu {
    background: #fff; border-radius: 12px; box-shadow: 0 1px 8px rgba(20, 30, 70, .07);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .liste-baslik {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none;
    padding: 11px 16px; border-bottom: 1px solid var(--gri-acik); font-weight: 700; font-size: 17px; color: var(--lacivert);
  }
  .liste-baslik::before { content: ""; width: 4px; height: 18px; background: var(--lacivert); border-radius: 2px; margin-right: -2px; }
  .liste-baslik .ad { flex: 1; }
  .sayi { min-width: 30px; text-align: center; padding: 2px 9px; border-radius: 20px; background: var(--lacivert); color: #fff; font-size: 14px; }
  .liste { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .liste-bos { color: var(--gri); text-align: center; padding: 24px 8px; font-size: 15px; }
  .kart-kalip {
    display: block; width: 100%; text-align: left; cursor: pointer; flex: none;
    border: 1.5px solid var(--gri-acik); border-radius: 10px; background: #fff; padding: 11px 14px;
    transition: border-color .15s, background .15s;
  }
  .kart-kalip:hover { border-color: var(--lacivert); background: #f8f9fc; }
  .kart-kalip .k-ad { font-weight: 700; font-size: 17px; color: var(--yazi); word-break: break-word; }
  .kart-kalip .k-alt { margin-top: 3px; font-size: 14px; color: var(--gri); display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .kart-kalip .k-ted { color: var(--lacivert); font-weight: 600; }
  .alt-cubuk { flex: none; display: flex; justify-content: flex-end; }

  /* İşçi karakteri */
  .orta { position: relative; }
  .isci-bekle { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); line-height: 0; }
  .isci-katman { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .isci-gezen { position: absolute; left: 0; top: 0; width: 24px; height: 42px; line-height: 0; will-change: transform; }
  .isci-gezen .isci-svg { transform-origin: 50% 50%; }
  .kalip-simge {
    position: absolute; left: 4px; top: 19px; width: 16px; height: 12px; border-radius: 2px;
    background: #9aa0aa; border: 1.5px solid #6d737d; opacity: 0;
  }
  .isci-svg .bacak { transform-box: fill-box; transform-origin: 50% 0; }
  .yuruyor .bacak-sol { animation: adim .34s ease-in-out infinite alternate; }
  .yuruyor .bacak-sag { animation: adim .34s ease-in-out infinite alternate-reverse; }
  @keyframes adim { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }

  /* Pencereler (detay, formlar, onaylar) */
  .perde {
    position: fixed; inset: 0; background: rgba(15, 20, 45, .45); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .pencere {
    background: #fff; border-radius: 14px; width: 100%; max-width: 720px; max-height: 100%;
    display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(10, 15, 40, .3);
  }
  .pencere.kucuk { max-width: 460px; }
  .pencere-ust {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--gri-acik); flex: none;
  }
  .pencere-ust h3 { margin: 0; flex: 1; font-size: 19px; color: var(--lacivert); word-break: break-word; }
  .kapat-x { border: none; background: none; font-size: 28px; line-height: 1; color: var(--gri); cursor: pointer; padding: 0 4px; }
  .kapat-x:hover { color: var(--yazi); }
  .pencere-govde { padding: 16px 18px; overflow-y: auto; }
  .pencere-govde form { gap: 12px; }
  .pencere-alt { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--gri-acik); flex: none; flex-wrap: wrap; }
  .not { font-size: 14px; color: var(--gri); margin: 0; }
  .form-hata { color: var(--hata); font-size: 15px; margin: 0; }
  .onay-metin { font-size: 16px; line-height: 1.5; margin: 0; }
  .onay-metin strong { color: var(--yazi); }

  /* Detay */
  .detay { display: grid; grid-template-columns: 260px 1fr; gap: 18px; }
  .foto-kutu {
    width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; background: var(--zemin); border: 1px solid var(--gri-acik);
    display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--gri); font-size: 14px; text-align: center;
  }
  .foto-kutu img { width: 100%; height: 100%; object-fit: contain; background: #fff; cursor: zoom-in; }
  .foto-islem { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .bilgi { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 15px; }
  .bilgi dt { color: var(--gri); font-weight: 600; }
  .bilgi dd { margin: 0; word-break: break-word; white-space: pre-line; }
  .durum-rozet { display: inline-block; padding: 1px 9px; border-radius: 20px; font-size: 13px; font-weight: 700; }
  .durum-rozet.raf { background: #e5f3ea; color: #1e6b3a; }
  .durum-rozet.dis { background: #e8ecf8; color: var(--lacivert); }
  .durum-rozet.arsiv { background: #f3e9d6; color: #7a5410; }
  .eylemler { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .gecmis-baslik { margin: 20px 0 10px; font-size: 16px; color: var(--lacivert); display: flex; align-items: center; gap: 8px; }
  .hareket { border: 1px solid var(--gri-acik); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
  .h-ust { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .h-ust strong { font-size: 15px; flex: 1; }
  .h-satir { display: grid; grid-template-columns: 90px 1fr; gap: 2px 8px; margin-top: 3px; }
  .h-et { color: var(--gri); font-weight: 600; }
  .h-acik { color: var(--yazi); white-space: pre-line; word-break: break-word; }
  .duzeltildi { font-size: 12px; color: #7a5410; background: #f3e9d6; padding: 1px 7px; border-radius: 10px; }
  .kaldirildi { font-size: 12px; color: var(--gri); }

  /* Tedarikçi ve arşiv listeleri */
  .satir-liste { display: flex; flex-direction: column; gap: 6px; }
  .satir { display: flex; align-items: center; gap: 8px; border: 1px solid var(--gri-acik); border-radius: 10px; padding: 8px 10px; }
  .satir .s-ad { flex: 1; font-weight: 600; word-break: break-word; }
  .satir input[type=text] { flex: 1; padding: 8px 10px; font-size: 16px; }
  .ekle-satir { display: flex; gap: 8px; margin-bottom: 12px; }
  .ekle-satir input { flex: 1; min-width: 0; }

  /* Bildirim */
  .bildirim {
    position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); z-index: 200;
    width: max-content; max-width: min(780px, calc(100% - 32px)); pointer-events: none;
    background: var(--lacivert); color: #fff; padding: 24px 40px; border-radius: 18px;
    font-size: 30px; font-weight: 700; line-height: 1.3; text-align: center; overflow-wrap: anywhere;
    box-shadow: 0 10px 36px rgba(10, 15, 40, .4); border: 3px solid rgba(255, 255, 255, .25);
    animation: bildirim-gir .25s ease-out;
  }
  .bildirim.hatali { background: var(--hata); font-size: 24px; }
  @keyframes bildirim-gir { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @media (max-width: 600px), (max-height: 520px) {
    .bildirim { font-size: 22px; padding: 16px 22px; bottom: 20px; border-radius: 14px; }
    .bildirim.hatali { font-size: 18px; }
  }

  /* Telefon dik: listeler alt alta, sayfa kayar */
  @media (max-width: 720px) and (orientation: portrait) {
    .uygulama { height: auto; min-height: 100dvh; }
    .kalip-sayfa { padding: 10px 12px; }
    .kalip-alan { grid-template-columns: 1fr; grid-template-rows: auto 60px auto; }
    .liste { max-height: 52dvh; }
    .detay { grid-template-columns: 1fr; }
    .perde { padding: 0; align-items: stretch; }
    .pencere { border-radius: 0; max-height: none; height: 100%; }
    .pencere.kucuk { height: auto; margin: auto 12px; border-radius: 14px; }
  }
  /* Yatay telefon / alçak ekran */
  @media (max-height: 520px) and (orientation: landscape) {
    .kalip-sayfa { padding: 8px 12px; gap: 6px; }
    .arac-cubugu h2 { font-size: 18px; }
    .btn { padding: 6px 11px; font-size: 14px; }
    .liste-baslik { padding: 7px 12px; font-size: 15px; }
    .kart-kalip { padding: 8px 11px; }
    .kart-kalip .k-ad { font-size: 15px; }
    .detay { grid-template-columns: 200px 1fr; }
    .ust { padding-top: 6px; padding-bottom: 6px; }
  }
</style>
</head>
<body>

<!-- ================= GİRİŞ ================= -->
<div class="giris" id="girisEkrani" hidden>
  <div class="giris-orta">
    <div class="kart">
      <div class="marka">
        <div class="logo">
          <div class="logo-kutu">tümersan</div>
          <div class="logo-alt"><span>OTOMOTİV</span></div>
        </div>
      </div>
      <div class="ayrac"></div>

      <div class="panel">
        <!-- 1. adım: bölüm seçimi -->
        <div id="secimAdimi">
          <h1>Giriş</h1>
          <div class="cizgi"></div>
          <p class="aciklama">Bölümünüzü seçin.</p>
          <div class="bolumler">
            <button class="bolum" data-bolum="yonetim">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>
              Yönetim
            </button>
            <button class="bolum" data-bolum="uretim">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
              Üretim
            </button>
          </div>
        </div>

        <!-- 2. adım: kullanıcı adı / şifre -->
        <div id="formAdimi" hidden>
          <button type="button" class="geri" id="geri">← Bölüm seçimine dön</button>
          <h1 id="formBaslik">Yönetim girişi</h1>
          <div class="cizgi"></div>
          <form id="girisFormu" autocomplete="on">
            <label>Kullanıcı adı
              <input type="text" id="kullaniciAdi" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </label>
            <label>Şifre
              <input type="password" id="sifre" autocomplete="current-password" required>
            </label>
            <label class="goster"><input type="checkbox" id="sifreGoster"> Şifreyi göster</label>
            <p class="hata" id="hata" hidden></p>
            <button type="submit" class="ana-buton" id="girisButonu">Giriş yap</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <div class="serit"></div>
</div>

<!-- ================= UYGULAMA ================= -->
<div class="uygulama" id="uygulamaEkrani" hidden>
  <header class="ust">
    <div class="ust-sol">
      <span class="marka-kucuk">tümersan</span>
      <span class="bolum-etiket" id="bolumEtiket"></span>
    </div>
    <div class="ust-orta"><span class="yonetim-baslik" id="yonetimBaslik" hidden>YÖNETİM</span></div>
    <div class="ust-sag">
      <span class="kim" id="kim"></span>
      <button class="cikis" id="cikis">Çıkış yap</button>
    </div>
  </header>

  <!-- Ana menü -->
  <main class="ana-sayfa" id="anaSayfa">
    <div class="moduller">
      <button class="bolum modul" id="modulKalip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h4M7 16.5h4"/></svg>
        Kalıp
      </button>
    </div>
  </main>

  <!-- Kalıp takibi (kalip.js) -->
  <main class="kalip-sayfa" id="kalipSayfa" hidden></main>
</div>

<div id="bildirim" class="bildirim" role="status" aria-live="polite" hidden></div>

<script>
  /* =====================================================================
     SUPABASE BAĞLANTISI
     Kullanıcılar ve şifreler artık bu dosyada değil, Supabase'te durur.
     Kullanıcı ekleme / şifre değiştirme: KULLANICI-YONETIMI.md dosyasına bakın.
     Aşağıdaki anahtar "publishable" (herkese açık) anahtardır; sayfada
     durması normaldir, tek başına kimseye yetki vermez.
     ===================================================================== */
  const SUPABASE_URL = "https://puzixopquysefichmkfh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ABf6LvHUj_K0WN4O6c_XUw_bPIQSscE";
  const ALAN_ADI = "tumersan.local";   // kullanıcı adı -> kullanici@tumersan.local

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const BOLUM_ADI = { yonetim: "Yönetim", uretim: "Üretim" };
  const $ = (s) => document.querySelector(s);
  let seciliBolum = null;
  let girisYapiliyor = false;

  // Kullanıcı adında büyük/küçük harf ve Türkçe harf farkı önemsiz:
  // "Muammer", "MUAMMER", "muammer" aynı; "Üretim" = "uretim", "URETIM" = "uretim"
  function adSadelestir(s) {
    const harf = { "ç": "c", "ğ": "g", "ı": "i", "ö": "o", "ş": "s", "ü": "u" };
    return s.trim().toLocaleLowerCase("tr-TR").replace(/[çğıöşü]/g, h => harf[h]);
  }
  const gorunenAd = (u) => (u.user_metadata && u.user_metadata.gorunen_ad) || u.email.split("@")[0];
  // Kullanıcının girebildiği bölümler (Supabase app_metadata.bolumler, ör. ["yonetim","uretim"])
  function bolumleri(u) {
    const m = u.app_metadata || {};
    const liste = Array.isArray(m.bolumler) ? m.bolumler : (m.bolum ? [m.bolum] : []);
    return liste.filter(b => BOLUM_ADI[b]);
  }
  // Hangi bölümle girildiği, çıkış yapılana kadar hatırlanır
  const BOLUM_ANAHTARI = "tumersan_bolum";
  function aktifBolumOku() { try { return localStorage.getItem(BOLUM_ANAHTARI); } catch { return null; } }
  function aktifBolumYaz(b) { try { b ? localStorage.setItem(BOLUM_ANAHTARI, b) : localStorage.removeItem(BOLUM_ANAHTARI); } catch {} }

  /* ---------- Ekranlar ---------- */
  function girisGoster() {
    $("#uygulamaEkrani").hidden = true;
    $("#girisEkrani").hidden = false;
    secimGoster();
  }
  function secimGoster() {
    seciliBolum = null;
    $("#secimAdimi").hidden = false;
    $("#formAdimi").hidden = true;
  }
  function formGoster(bolum) {
    seciliBolum = bolum;
    $("#formBaslik").textContent = BOLUM_ADI[bolum] + " girişi";
    $("#girisFormu").reset();
    hataGoster("");
    $("#sifre").type = "password";
    $("#secimAdimi").hidden = true;
    $("#formAdimi").hidden = false;
    $("#kullaniciAdi").focus();
  }
  // Uygulamanın geri kalanı (kalip.js) bu bilgileri kullanır
  window.oturum = { bolum: null, user: null, yonetim: false };

  function uygulamaGoster(user, bolum) {
    aktifBolumYaz(bolum);
    window.oturum = { bolum, user, yonetim: bolum === "yonetim" };
    $("#girisEkrani").hidden = true;
    $("#uygulamaEkrani").hidden = false;
    // Yönetim: ortada büyük YÖNETİM; Üretim: logonun yanında küçük etiket
    $("#yonetimBaslik").hidden = bolum !== "yonetim";
    $("#bolumEtiket").textContent = bolum === "yonetim" ? "" : BOLUM_ADI[bolum];
    $("#bolumEtiket").hidden = bolum === "yonetim";
    $("#kim").textContent = gorunenAd(user);
    sayfaGoster();
  }

  /* ---------- Sayfalar (adres çubuğundaki #kalip ile; geri tuşu çalışır) ---------- */
  function sayfaGoster() {
    if ($("#uygulamaEkrani").hidden) return;
    const kalip = location.hash === "#kalip";
    $("#anaSayfa").hidden = kalip;
    $("#kalipSayfa").hidden = !kalip;
    if (kalip) window.Kalip && Kalip.ac(); else window.Kalip && Kalip.kapat();
  }
  window.addEventListener("hashchange", sayfaGoster);
  $("#modulKalip").onclick = () => { location.hash = "kalip"; };
  function hataGoster(mesaj) {
    $("#hata").textContent = mesaj;
    $("#hata").hidden = !mesaj;
  }
  function hataCevir(err) {
    const m = (err && err.message || "").toLowerCase();
    if (m.includes("invalid login")) return "Kullanıcı adı veya şifre hatalı.";
    if (m.includes("rate limit") || m.includes("too many") || m.includes("security purposes"))
      return "Çok sık deneme yapıldı. Bir dakika bekleyip tekrar deneyin.";
    if (m.includes("fetch") || m.includes("network"))
      return "Sunucuya ulaşılamadı. İnternet bağlantısını kontrol edin.";
    return "Bir hata oluştu: " + (err && err.message || "bilinmeyen hata");
  }

  /* ---------- Olaylar ---------- */
  document.querySelectorAll("[data-bolum]").forEach(b => b.onclick = () => formGoster(b.dataset.bolum));
  $("#geri").onclick = secimGoster;
  $("#sifreGoster").onchange = (e) => { $("#sifre").type = e.target.checked ? "text" : "password"; };

  $("#girisFormu").onsubmit = async (e) => {
    e.preventDefault();
    const ad = adSadelestir($("#kullaniciAdi").value);
    const sifre = $("#sifre").value;
    const btn = $("#girisButonu");
    hataGoster("");
    btn.disabled = true; btn.textContent = "Giriş yapılıyor...";
    girisYapiliyor = true;
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email: `${ad}@${ALAN_ADI}`, password: sifre });
      if (error) throw error;
      // Kullanıcı seçtiği bölüme kayıtlı mı?
      const izinli = bolumleri(data.user);
      if (!izinli.includes(seciliBolum)) {
        await sb.auth.signOut();
        hataGoster(izinli.length
          ? `Bu kullanıcı yalnızca ${izinli.map(b => BOLUM_ADI[b]).join(" ve ")} bölümüne girebilir.`
          : "Bu kullanıcıya henüz bölüm atanmamış. Yöneticiye başvurun.");
        return;
      }
      uygulamaGoster(data.user, seciliBolum);
    } catch (err) {
      hataGoster(hataCevir(err));
      $("#sifre").value = "";
      $("#sifre").focus();
    } finally {
      girisYapiliyor = false;
      btn.disabled = false; btn.textContent = "Giriş yap";
    }
  };

  $("#cikis").onclick = async () => {
    aktifBolumYaz(null);
    window.Kalip && Kalip.kapat();
    history.replaceState(null, "", location.pathname + location.search);
    await sb.auth.signOut();
    girisGoster();
  };

  // Oturum başka bir sebeple kapanırsa (kullanıcı silindi, süre doldu) giriş ekranına dön
  sb.auth.onAuthStateChange((olay) => {
    if (olay === "SIGNED_OUT" && !girisYapiliyor) { window.Kalip && Kalip.kapat(); girisGoster(); }
  });

  /* ---------- Açılış: Çıkış yapılana kadar oturum hatırlanır ---------- */
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return girisGoster();
    // Kullanıcı hâlâ geçerli mi, sunucuya sor (silindiyse oturumu kapat)
    const { data, error } = await sb.auth.getUser();
    if (error && error.status && error.status >= 400 && error.status < 500) {
      await sb.auth.signOut();
      return girisGoster();
    }
    const user = (data && data.user) || session.user;
    // Girilen bölüm hâlâ izinli mi? (yetkisi alındıysa oturumu kapat)
    const bolum = aktifBolumOku();
    if (!bolumleri(user).includes(bolum)) { aktifBolumYaz(null); await sb.auth.signOut(); return girisGoster(); }
    // Yetki bilgisi oturum anahtarının içinde taşınır; değişmişse güncel halini almak için yenile
    if (!error) await sb.auth.refreshSession();
    uygulamaGoster(user, bolum);
  })();
</script>
<!-- Excel aktarımı için ExcelJS, ilk kullanımda kalip.js tarafından yüklenir -->
<script src="kalip.js"></script>
</body>
</html>
